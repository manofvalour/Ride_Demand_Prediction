<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NYC Demand Intelligence - Interactive Map</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div></div>

<div id="errorBanner">
    <i data-lucide="alert-triangle" size="16"></i>
    <span id="errorMessage">Failed to load demand data. Retrying...</span>
    <button class="dismiss-error" onclick="dismissError()">&times;</button>
</div>

<div class="app-layout">
    <header class="header-banner">
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle Sidebar">
            <i data-lucide="panel-left-open" id="sidebarToggleIcon" size="18"></i>
        </button>
        <div class="clock-section">
            <div id="liveClock">--:--:-- --</div>
            <div id="liveDate">---, --- --, ----</div>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Total Demand</span>
            <span id="cityTotalDemand" class="citywide-value">-- TRIPS</span>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Avg Speed</span>
            <span id="cityAvgSpeed" class="citywide-value">-- MPH</span>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Congestion</span>
            <span id="cityCongestion" class="citywide-value">--</span>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Condition</span>
            <span id="cityCongestionLevel" class="citywide-value">--</span>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Feels Like</span>
            <span id="cityFeelsLike" class="citywide-value">--</span>
        </div>
        <div class="citywide-counter">
            <span class="citywide-label">Humidity</span>
            <span id="cityHumidity" class="citywide-value">--</span>
        </div>
        <button class="refresh-toggle" onclick="toggleAutoRefresh()" title="Toggle Auto-Refresh">
            <i data-lucide="refresh-cw" id="refreshIcon" size="16"></i>
            <span class="refresh-dot active" id="refreshDot"></span>
        </button>
        <span id="refreshIndicator" style="display:none;">
            <i data-lucide="loader" size="12" class="paused" id="refreshLoader"></i>
            <span id="refreshCountdown">--</span>
        </span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
            <i data-lucide="moon" id="themeIcon" size="18"></i>
        </button>
        <div style="margin-left: auto; font-size: 0.6rem; font-weight: 900; background: #fee2e2; color: #b91c1c; padding: 6px 12px; border-radius: 6px; border: 1px solid #fecaca; white-space: nowrap;">
            <i data-lucide="map-pin" size="12" style="display:inline; margin-right:4px;"></i>NY TIME: LIVE FEED
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-drag-handle" onclick="toggleSidebar()"></div>
            <div class="controls-container">
                <div>
                    <span class="dropdown-label">Search Neighborhood</span>
                    <div class="search-input-wrapper">
                        <i data-lucide="search" size="16"></i>
                        <input type="text" id="zoneSearch" placeholder="Type to filter...">
                    </div>
                </div>
                <div>
                    <span class="dropdown-label">Filter Borough</span>
                    <select id="boroughFilter">
                        <option value="All">All Boroughs</option>
                        <option value="Manhattan">Manhattan</option>
                        <option value="Brooklyn">Brooklyn</option>
                        <option value="Queens">Queens</option>
                        <option value="Bronx">Bronx</option>
                        <option value="Staten Island">Staten Island</option>
                    </select>
                </div>
            </div>

            <div class="nav-tabs">
                <div class="nav-tab active" id="tab-demand" onclick="switchTab('demand')">Demand</div>
                <div class="nav-tab" id="tab-profit" onclick="switchTab('profit')">Profitability</div>
            </div>

            <div style="padding: 1rem 1rem 0.5rem 1rem; background: var(--bg); border-bottom: 1px solid var(--border);">
                <div id="listTitleContainer">
                    <span id="listTitle" style="font-weight: 800; color: var(--primary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;">Zone Analytics</span>
                    <span id="clearSelection" class="clear-btn" style="display:none;" onclick="resetSelection()">Reset View</span>
                </div>
            </div>
            <div class="scroll-area" id="zoneList"></div>
        </aside>
        <div id="map"></div>
    </div>
</div>

<script>
    const API_URL = "/api/demand";
    const GEOJSON_FILE = "{{ url_for('get_geojson') }}";
    const REFRESH_INTERVAL_MS = 300000; // 5 min

    let map, geoLayer, taxiData = {}, allFeatures = [];
    let selectedZoneId = null;
    let currentTab = 'demand';
    let autoRefreshEnabled = true;
    let refreshTimer = null;
    let refreshCountdown = 0;
    let countdownTimer = null;
    let isLoading = false;

    const THRESHOLDS = { LOW: 0.0270, MEDIUM: 0.0421 };

    function getCongestionLevel(val) {
        if (!val) return { label: 'Low', class: 'status-low' };
        if (val <= THRESHOLDS.LOW) return { label: 'Low', class: 'status-low' };
        if (val <= THRESHOLDS.MEDIUM) return { label: 'Medium', class: 'status-medium' };
        return { label: 'High', class: 'status-high' };
    }

    function calculateSpeedFromIndex(index) {
        return Math.max(5, (25 - (index * 200))).toFixed(1);
    }

    function showError(msg) {
        document.getElementById('errorMessage').innerText = msg;
        document.getElementById('errorBanner').style.display = 'flex';
    }

    function dismissError() {
        document.getElementById('errorBanner').style.display = 'none';
    }

    function showLoading() {
        isLoading = true;
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        isLoading = false;
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    function renderSkeletonCards(count) {
        const list = document.getElementById('zoneList');
        list.innerHTML = Array.from({ length: count }, () => `
            <div class="skeleton-card">
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line"></div>
            </div>
        `).join('');
    }

    function toggleAutoRefresh() {
        autoRefreshEnabled = !autoRefreshEnabled;
        const dot = document.getElementById('refreshDot');
        const icon = document.getElementById('refreshIcon');
        if (autoRefreshEnabled) {
            dot.className = 'refresh-dot active';
            icon.setAttribute('data-lucide', 'refresh-cw');
            document.getElementById('refreshIndicator').style.display = 'none';
            startAutoRefresh();
        } else {
            dot.className = 'refresh-dot paused';
            icon.setAttribute('data-lucide', 'refresh-cw-off');
            stopAutoRefresh();
        }
        lucide.createIcons();
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        refreshCountdown = REFRESH_INTERVAL_MS / 1000;
        const indicator = document.getElementById('refreshIndicator');
        indicator.style.display = 'flex';
        updateCountdownDisplay();
        countdownTimer = setInterval(() => {
            refreshCountdown--;
            if (refreshCountdown <= 0) {
                refreshCountdown = REFRESH_INTERVAL_MS / 1000;
            }
            updateCountdownDisplay();
        }, 1000);
        refreshTimer = setInterval(refreshData, REFRESH_INTERVAL_MS);
    }

    function stopAutoRefresh() {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        document.getElementById('refreshIndicator').style.display = 'none';
    }

    function updateCountdownDisplay() {
        const min = Math.floor(refreshCountdown / 60);
        const sec = Math.floor(refreshCountdown % 60);
        document.getElementById('refreshCountdown').innerText = `${min}:${sec.toString().padStart(2, '0')}`;
    }

    function toggleTheme() {
        const html = document.documentElement;
        const icon = document.getElementById('themeIcon');
        if (html.getAttribute('data-theme') === 'light') {
            html.setAttribute('data-theme', 'dark');
            icon.setAttribute('data-lucide', 'sun');
            updateMapStyle('dark');
        } else {
            html.setAttribute('data-theme', 'light');
            icon.setAttribute('data-lucide', 'moon');
            updateMapStyle('light');
        }
        lucide.createIcons();
    }

    function updateMapStyle(theme) {
        const existing = document.querySelector('.leaflet-layer');
        if (existing) existing.remove();
        const url = theme === 'dark'
            ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
            : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
        L.tileLayer(url, { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>' }).addTo(map);
    }

    function updateClock() {
        const now = new Date();
        const opts = { timeZone: 'America/New_York' };
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', { ...opts, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        document.getElementById('liveDate').innerText = now.toLocaleDateString('en-US', { ...opts, weekday: 'long', year: 'numeric', month: 'long', day: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getDemandColor(d) {
        return d > 200 ? '#312e81' : d > 120 ? '#4338ca' : d > 60 ? '#6366f1' : d > 20 ? '#a5b4fc' : d > 0 ? '#e0e7ff' : '#f1f5f9';
    }

    function getProfitColor(p) {
        return p > 1500 ? '#064e3b' : p > 1000 ? '#059669' : p > 500 ? '#34d399' : p > 200 ? '#a7f3d0' : p > 0 ? '#ecfdf5' : '#f1f5f9';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-demand').classList.toggle('active', tab === 'demand');
        document.getElementById('tab-profit').classList.toggle('active', tab === 'profit');
        updateDashboard();
        if(geoLayer) geoLayer.setStyle(f => {
            const id = f.properties.location_id || f.properties.OBJECTID;
            const stats = taxiData[id] || { target_yellow: 0, target_green: 0, target_hvfhv: 0, zone_congestion_index: 0 };
            const total = stats.target_yellow + stats.target_green + stats.target_hvfhv;
            if (currentTab === 'demand') {
                return { fillColor: getDemandColor(total) };
            } else {
                const profit = total / (stats.zone_congestion_index + 0.1);
                return { fillColor: getProfitColor(profit) };
            }
        });
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const icon = document.getElementById('sidebarToggleIcon');
        sidebar.classList.toggle('open');
        if (sidebar.classList.contains('open')) {
            icon.setAttribute('data-lucide', 'panel-left-close');
        } else {
            icon.setAttribute('data-lucide', 'panel-left-open');
        }
        lucide.createIcons();
    }

    async function fetchData() {
        dismissError();
        showLoading();
        renderSkeletonCards(6);
        try {
            const [demandRes, geoRes] = await Promise.all([
                fetch(API_URL).then(r => {
                    if (!r.ok) throw new Error(`API returned ${r.status}`);
                    return r.json();
                }),
                fetch(GEOJSON_FILE).then(r => {
                    if (!r.ok) throw new Error(`GeoJSON returned ${r.status}`);
                    return r.json();
                })
            ]);

            if (demandRes.error) throw new Error(demandRes.error);

            taxiData = demandRes.predictions;
            allFeatures = geoRes.features;

            if (Object.keys(taxiData).length === 0) {
                showError('No prediction data available for the current time window.');
            }

            updateCitywideHeader();
            updateDashboard();
            renderMap(geoRes);
            hideLoading();
        } catch (err) {
            console.error("Data Load Error:", err);
            hideLoading();
            showError('Failed to load demand data. ' + (err.message || 'Check connection and try again.'));
        }
    }

    async function refreshData() {
        if (isLoading) return;
        dismissError();
        const loader = document.getElementById('refreshLoader');
        loader.classList.remove('paused');
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`API returned ${res.status}`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            taxiData = data.predictions;
            if (Object.keys(taxiData).length === 0) {
                showError('No prediction data available for the current time window.');
            }
            updateCitywideHeader();
            updateDashboard();
            if (geoLayer) {
                geoLayer.setStyle(f => {
                    const id = f.properties.location_id || f.properties.OBJECTID;
                    const stats = taxiData[id] || { target_yellow: 0, target_green: 0, target_hvfhv: 0, zone_congestion_index: 0 };
                    const total = stats.target_yellow + stats.target_green + stats.target_hvfhv;
                    let color;
                    if(currentTab === 'demand') {
                        color = getDemandColor(total);
                    } else {
                        const profit = total / (stats.zone_congestion_index + 0.1);
                        color = getProfitColor(profit);
                    }
                    return { fillColor: color };
                });
            }
        } catch (err) {
            console.error("Refresh Error:", err);
            showError('Auto-refresh failed. ' + (err.message || ''));
        } finally {
            loader.classList.add('paused');
        }
    }

    function updateCitywideHeader() {
        const zones = Object.values(taxiData);
        if (zones.length === 0) return;
        const totalCityDemand = zones.reduce((acc, curr) => acc + (curr.target_yellow || 0) + (curr.target_green || 0) + (curr.target_hvfhv || 0), 0);
        const first = zones[0];
        if (first) {
            const cityIdx = first.city_congestion_index || 0;
            const cityLevel = getCongestionLevel(cityIdx);
            document.getElementById('cityTotalDemand').innerText = `${Math.round(totalCityDemand).toLocaleString()} TRIPS`;
            document.getElementById('cityAvgSpeed').innerText = `${calculateSpeedFromIndex(cityIdx)} MPH`;
            document.getElementById('cityCongestion').innerText = cityIdx.toFixed(3);
            document.getElementById('cityCongestionLevel').innerText = cityLevel.label;
            document.getElementById('cityFeelsLike').innerText = `${first.feelslike}°F`;
            document.getElementById('cityHumidity').innerText = `${first.humidity}%`;
        }
    }

    function fitMapToFilter() {
        const bFilter = document.getElementById('boroughFilter').value;
        const bounds = L.latLngBounds();
        let count = 0;
        geoLayer.eachLayer(layer => {
            if (bFilter === 'All' || layer.feature.properties.borough === bFilter) {
                bounds.extend(layer.getBounds());
                count++;
            }
        });
        if (count > 0) map.flyToBounds(bounds, { padding: [30, 30], duration: 1.5 });
    }

    function updateDashboard() {
        const bFilter = document.getElementById('boroughFilter').value;
        const sQuery = document.getElementById('zoneSearch').value.toLowerCase();
        const list = document.getElementById('zoneList');
        const listTitle = document.getElementById('listTitle');
        const clearBtn = document.getElementById('clearSelection');

        let filtered;
        if (selectedZoneId) {
            filtered = allFeatures.filter(f => (f.properties.location_id || f.properties.OBJECTID) == selectedZoneId);
            listTitle.innerText = "Selected Zone Details";
            clearBtn.style.display = 'block';
        } else {
            filtered = allFeatures.filter(f => {
                const matchesBorough = bFilter === 'All' || f.properties.borough === bFilter;
                const matchesSearch = f.properties.zone.toLowerCase().includes(sQuery);
                return matchesBorough && matchesSearch;
            });
            listTitle.innerText = currentTab === 'demand' ? `Top ${Math.min(filtered.length, 20)} Demand` : `Top Profitability Zones`;
            clearBtn.style.display = 'none';
        }

        const data = filtered.map(f => {
            const id = f.properties.location_id || f.properties.OBJECTID;
            const stats = taxiData[id] || { target_yellow: 0, target_green: 0, target_hvfhv: 0, zone_congestion_index: 0 };
            const total = stats.target_yellow + stats.target_green + stats.target_hvfhv;
            const profitScore = (total / (stats.zone_congestion_index + 0.1)).toFixed(0);
            return { f, total, id, stats, profitScore };
        });

        if (!selectedZoneId) {
            if (currentTab === 'demand') data.sort((a, b) => b.total - a.total);
            else data.sort((a, b) => b.profitScore - a.profitScore);
        }

        const displayData = selectedZoneId ? data : data.slice(0, 20);

        list.innerHTML = displayData.map(item => {
            const cong = getCongestionLevel(item.stats.zone_congestion_index);
            const zoneSpeed = calculateSpeedFromIndex(item.stats.zone_congestion_index);

            let statsHtml = `
                <div class="demand-row">
                    <div class="stat-box stat-yel">YEL: ${Math.round(item.stats.target_yellow)}</div>
                    <div class="stat-box stat-grn">GRN: ${Math.round(item.stats.target_green)}</div>
                    <div class="stat-box stat-fhv">FHV: ${Math.round(item.stats.target_hvfhv)}</div>
                </div>`;

            if (currentTab === 'profit') {
                statsHtml = `
                <div class="demand-row" style="grid-template-columns: 1fr;">
                    <div class="stat-box stat-profit">PROFITABILITY SCORE: ${item.profitScore}</div>
                </div>`;
            }

            return `
                <div class="detail-card ${selectedZoneId == item.id ? 'active' : ''}" id="card-${item.id}" onclick="focusZone('${item.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <div style="font-weight:800; font-size:0.85rem; color:var(--text);">${item.f.properties.zone}</div>
                            <div style="font-size:0.6rem; color:var(--subtext); margin-bottom:4px;">${item.f.properties.borough}</div>
                            <div class="congestion-indicator ${cong.class}">Traffic: ${cong.label}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end;">
                            <div style="font-weight:900; font-size:0.75rem; color:var(--text);">
                                ${(item.stats.zone_congestion_index || 0).toFixed(3)}
                                <span style="font-weight:500; font-size:0.6rem;">IDX</span>
                            </div>
                            <div class="speed-label">${zoneSpeed} MPH</div>
                        </div>
                    </div>
                    ${statsHtml}
                </div>`;
        }).join('');

        if (window.innerWidth <= 768 && !selectedZoneId) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                document.getElementById('sidebarToggleIcon').setAttribute('data-lucide', 'panel-left-open');
                lucide.createIcons();
            }
        }
    }

    function renderMap(geoData) {
        if (geoLayer) {
            map.removeLayer(geoLayer);
        }
        geoLayer = L.geoJson(geoData, {
            style: (f) => {
                const id = f.properties.location_id || f.properties.OBJECTID;
                const stats = taxiData[id] || { target_yellow: 0, target_green: 0, target_hvfhv: 0, zone_congestion_index: 0 };
                const total = stats.target_yellow + stats.target_green + stats.target_hvfhv;

                let color;
                if(currentTab === 'demand') {
                    color = getDemandColor(total);
                } else {
                    const profit = total / (stats.zone_congestion_index + 0.1);
                    color = getProfitColor(profit);
                }

                return { fillColor: color, fillOpacity: 0.7, weight: 1, color: 'white' };
            },
            onEachFeature: (f, layer) => {
                const id = f.properties.location_id || f.properties.OBJECTID;
                layer.on({
                    mouseover: (e) => {
                        const d = taxiData[id] || { target_yellow: 0, target_green: 0, target_hvfhv: 0, zone_congestion_index: 0 };
                        const total = d.target_yellow + d.target_green + d.target_hvfhv;
                        const cong = getCongestionLevel(d.zone_congestion_index);
                        const zoneSpeed = calculateSpeedFromIndex(d.zone_congestion_index);
                        const profit = (total / (d.zone_congestion_index + 0.1)).toFixed(0);

                        layer.setStyle({ weight: 3, color: '#4338ca', fillOpacity: 0.8 });
                        layer.bindTooltip(`
                            <div class="hover-tooltip">
                                <span class="tooltip-title">${f.properties.zone}</span>
                                <div class="congestion-indicator ${cong.class}" style="margin-bottom:8px">${cong.label} Congestion</div><br>
                                <span class="tooltip-stat">Avg Speed: <span class="tooltip-value" style="color:var(--speed-text)">${zoneSpeed} MPH</span></span><br>
                                <span class="tooltip-stat">Live Demand: <span class="tooltip-value">${Math.round(total)} trips</span></span><br>
                                <span class="tooltip-stat">Profitability: <span class="tooltip-value">${profit} Score</span></span>
                            </div>`, { sticky: true }).openTooltip();
                    },
                    mouseout: (e) => { geoLayer.resetStyle(e.target); },
                    click: (e) => {
                        L.DomEvent.stopPropagation(e);
                        selectedZoneId = id;
                        updateDashboard();
                        map.fitBounds(layer.getBounds(), { padding: [100, 100], maxZoom: 14 });
                    }
                });
            }
        }).addTo(map);
    }

    function focusZone(id) {
        selectedZoneId = id;
        updateDashboard();
        geoLayer.eachLayer(l => {
            if((l.feature.properties.location_id || l.feature.properties.OBJECTID) == id) {
                map.fitBounds(l.getBounds(), { padding: [100, 100], maxZoom: 14 });
            }
        });
    }

    function resetSelection() {
        selectedZoneId = null;
        updateDashboard();
        fitMapToFilter();
    }

    async function init() {
        lucide.createIcons();
        map = L.map('map', { zoomControl: false }).setView([40.7128, -74.0060], 11);
        updateMapStyle('light');

        await fetchData();

        document.getElementById('boroughFilter').addEventListener('change', () => {
            selectedZoneId = null;
            updateDashboard();
            fitMapToFilter();
        });

        document.getElementById('zoneSearch').addEventListener('input', () => {
            selectedZoneId = null;
            updateDashboard();
        });

        if (autoRefreshEnabled) startAutoRefresh();
    }

    init();
</script>
</body>
</html>
